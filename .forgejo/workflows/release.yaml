name: Release-plz

on:
  push:
    branches:
      - main

jobs:
  # Create a PR with the new versions and changelog, preparing the next release.
  release-plz-pr:
    name: Release-plz PR
    runs-on: debian-trixie
    if: ${{ github.repository_owner == 'obmarg' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: https://github.com/dtolnay/rust-toolchain@1.85.0

      - name: Install jq
        run: apt-get update && apt-get install jq --yes --no-install-recommends

      - uses: https://github.com/cargo-bins/cargo-binstall@bc432b49369a3f25c8c8b19578a82060c18a5dd6
        with:
          version: 1.17.6

      - name: Install cargo-semver-checks
        run: cargo binstall cargo-semver-checks

      - name: Run release-plz
        uses: https://github.com/obmarg/release-plz-action@support-codeberg
        with:
          command: release-pr
          forge: "gitea"
          repository_url: https://codeberg.org/${FORGEJO_REPOSITORY}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
